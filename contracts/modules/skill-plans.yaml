                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /skill-planning/personal-skill-plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 4294967295, x-go-type: uint } }
    get:
      operationId: getPersonalSkillPlan
      x-gin-access: ["jwt", "login", "cap:menu.skill_planning", "login"]
      parameters:
        - { name: lang, in: query, schema: { type: string }, description: Falls back to the Accept-Language header and language cookie before using zh. }
      responses:
