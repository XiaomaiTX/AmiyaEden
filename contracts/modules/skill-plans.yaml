paths:
  /skill-planning/skill-plans:
    get:
      operationId: listSkillPlans
      x-gin-access: ["jwt", "login", "cap:menu.skill_planning", "login"]
      parameters:
        - { name: current, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 50 }, description: Values outside 1–100 use 50. }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: Skill plan page or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SkillPlanPageSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createSkillPlan
      x-gin-access: ["jwt", "login", "cap:menu.skill_planning", "role:admin,senior_fc"]
      parameters:
        - { name: lang, in: query, schema: { type: string }, description: Falls back to the Accept-Language header and language cookie before using zh. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillPlanCreateInput' }
      responses:
        '200':
          description: Skill plan details or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SkillPlanDetailSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
