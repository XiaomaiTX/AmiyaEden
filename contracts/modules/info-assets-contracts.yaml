        language: {"type": "string", "x-go-name": "Language", "x-order": 1, "x-go-type-skip-optional-pointer": true, "description": "Defaults to zh when empty.", "default": "zh"}
    InfoAssetTreeItem:
      type: object
      required: ["item_id", "type_id", "type_name", "group_name", "category_id", "quantity", "location_flag", "is_singleton", "character_id", "character_name"]
      properties:
        item_id: {"type": "integer", "format": "int64", "x-go-name": "ItemID", "x-order": 1}
        type_id: {"type": "integer", "x-go-name": "TypeID", "x-order": 2}
        type_name: {"type": "string", "x-go-name": "TypeName", "x-order": 3}
        group_name: {"type": "string", "x-go-name": "GroupName", "x-order": 4}
        category_id: {"type": "integer", "x-go-name": "CategoryID", "x-order": 5}
        quantity: {"type": "integer", "x-go-name": "Quantity", "x-order": 6}
        location_flag: {"type": "string", "x-go-name": "LocationFlag", "x-order": 7}
        is_singleton: {"type": "boolean", "x-go-name": "IsSingleton", "x-order": 8}
        is_blueprint_copy: {"type": "boolean", "x-go-name": "IsBlueprintCopy", "x-order": 9}
        asset_name: {"type": "string", "x-go-name": "AssetName", "x-order": 10, "x-go-type-skip-optional-pointer": true}
        character_id: {"type": "integer", "format": "int64", "x-go-name": "CharacterID", "x-order": 11}
        character_name: {"type": "string", "x-go-name": "CharacterName", "x-order": 12}
        children: {"type": "array", "items": {"$ref": "#/components/schemas/InfoAssetTreeItem"}, "x-go-name": "Children", "x-order": 13, "x-go-type-skip-optional-pointer": true}
    InfoAssetTreeLocation:
      type: object
      required: ["location_id", "location_type", "location_name", "items"]
      properties:
        location_id: {"type": "integer", "format": "int64", "x-go-name": "LocationID", "x-order": 1}
        location_type: {"type": "string", "x-go-name": "LocationType", "x-order": 2}
        location_name: {"type": "string", "x-go-name": "LocationName", "x-order": 3}
        items: {"type": "array", "items": {"$ref": "#/components/schemas/InfoAssetTreeItem"}, "x-go-name": "Items", "x-order": 4}
    InfoAssets:
      type: object
