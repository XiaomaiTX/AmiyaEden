        page: {"type": "integer", "x-go-name": "Page", "x-order": 2, "x-go-type-skip-optional-pointer": true, "description": "Nonpositive values default to 1.", "default": 1}
        page_size: {"type": "integer", "x-go-name": "PageSize", "x-order": 3, "x-go-type-skip-optional-pointer": true, "description": "Nonpositive values and values over 100 default to 20.", "default": 20}
