        character_count: {"type": "integer", "x-go-name": "CharacterCount", "x-order": 6}
    InfoAssetLocations:
      type: object
      required: ["total_locations", "total_items", "locations"]
      properties:
        total_locations: {"type": "integer", "x-go-name": "TotalLocations", "x-order": 1}
        total_items: {"type": "integer", "x-go-name": "TotalItems", "x-order": 2}
        locations: {"type": "array", "items": {"$ref": "#/components/schemas/InfoAssetLocationSummary"}, "x-go-name": "Locations", "x-order": 3}
