paths:
  /info/assets:
    post:
      operationId: getAssets
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.assets.read"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/InfoAssetsInput"}
      responses:
        '200':
          description: Query result or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/InfoAssetsSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /info/assets/locations:
    post:
      operationId: getAssetLocations
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.assets.read"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/InfoAssetLocationsInput"}
      responses:
        '200':
          description: Query result or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/InfoAssetLocationsSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /info/assets/location-items:
    post:
      operationId: getAssetLocationItems
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.assets.read"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/InfoAssetLocationItemsInput"}
      responses:
        '200':
          description: Query result or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/InfoAssetLocationItemsSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /info/assets/children:
    post:
      operationId: getAssetChildren
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.assets.read"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/InfoAssetChildrenInput"}
      responses:
        '200':
          description: Query result or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/InfoAssetChildrenSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /info/contracts:
    post:
      operationId: getContracts
      x-gin-body: { allowEmpty: true, allowMalformedJSON: true }
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.contracts.read"]
      requestBody:
        description: >-
          An empty object or JSON null uses page 1 with size 200. A missing body
          or a JSON binding error falls back to page 1 with size 20; successfully
          decoded filters may still apply when a field fails to bind.
        required: false
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/InfoContractsInput"}
      responses:
        '200':
          description: Query result or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/InfoContractsSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /info/contracts/detail:
    post:
      operationId: getContractDetail
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.contracts.read"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/InfoContractDetailInput"}
      responses:
        '200':
          description: Query result or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/InfoContractDetailSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  schemas:
    InfoAssetsInput:
      type: object
