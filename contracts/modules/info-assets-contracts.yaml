      properties:
        total_items: {"type": "integer", "x-go-name": "TotalItems", "x-order": 1}
        locations: {"type": "array", "items": {"$ref": "#/components/schemas/InfoAssetTreeLocation"}, "x-go-name": "Locations", "x-order": 2}
    InfoAssetLocationsInput:
