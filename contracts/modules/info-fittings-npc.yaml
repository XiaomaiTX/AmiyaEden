paths:
  /info/fittings:
    post:
      operationId: getFittings
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.fittings.manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/InfoFittingsInput"}
      responses:
        '200':
          description: Query or mutation result, or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/InfoFittingsSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /info/fittings/save:
    post:
      operationId: saveFitting
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.fittings.manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/SaveFittingInput"}
      responses:
        '200':
          description: Saved fitting (slot details are not hydrated; slots is null), or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/InfoFittingSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /info/npc-kills:
    post:
      operationId: getNpcKills
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.npc_kills.self"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/NpcKillCharacterInput"}
      responses:
        '200':
          description: Query or mutation result, or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/NpcKillDataSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /info/npc-kills/all:
    post:
      operationId: getAllNpcKills
      x-gin-access: ["jwt", "login", "cap:menu.info", "cap:info.npc_kills.self"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/NpcKillAllInput"}
      responses:
        '200':
          description: Query or mutation result, or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/NpcKillDataSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/npc-kills:
    post:
      operationId: getCorpNpcKills
      x-gin-access: ["jwt", "login", "role:admin", "cap:menu.dashboard", "cap:dashboard.npc_kills.corp", "cap:info.npc_kills.corp"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/NpcKillCorpInput"}
      responses:
        '200':
          description: Query or mutation result, or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - {"$ref": "#/components/schemas/NpcKillCorpDataSuccess"}
                  - {"$ref": "#/components/schemas/BusinessError"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
