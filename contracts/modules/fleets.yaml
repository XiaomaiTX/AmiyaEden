paths:
  /operation/fleets:
    get:
      operationId: listFleets
      x-gin-ignore-invalid-query: ["fc_user_id"]
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      parameters:
        - name: current
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
          description: Page size capped at 100.
        - name: importance
          in: query
          schema: { type: string }
        - name: fc_user_id
          in: query
          schema: { type: integer, minimum: 0, x-go-type: uint, maximum: 4294967295 }
          description: Invalid values are ignored.
      responses:
        '200': { $ref: '#/components/responses/FleetPageResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createFleet
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetCreateInput' }
      responses:
        '200': { $ref: '#/components/responses/FleetRecordResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/QQOfficialConflict' }
        '429': { $ref: '#/components/responses/QQOfficialRateLimited' }
        '503': { $ref: '#/components/responses/QQOfficialUnavailable' }
  /operation/fleets/me:
    get:
      operationId: getMyFleets
      x-gin-access: ["jwt", "login", "cap:menu.operation"]
      responses:
        '200': { $ref: '#/components/responses/MyFleetListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFleet
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetRecordResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateFleet
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/FleetRecordResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: deleteFleet
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin"]
      responses:
        '200': { $ref: '#/components/responses/FleetNullResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}/refresh-esi:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: refreshFleetESI
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetRecordResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMembers
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetMemberListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}/members-pap:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMembersWithPap
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      parameters:
        - name: current
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 260 }
          description: Page size capped at 260.
      responses:
        '200': { $ref: '#/components/responses/FleetMemberWithPapPageResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}/members/manual:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: manualAddMembers
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetManualAddInput' }
      responses:
        '200': { $ref: '#/components/responses/FleetManualAddResultDataResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}/members/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: syncESIMembers
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetESIMemberListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}/pap:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPapLogs
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetPapLogListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: issuePap
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetNullResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/pap/me:
    get:
      operationId: getMyPapLogs
      x-gin-access: ["jwt", "login", "cap:menu.operation"]
      responses:
        '200': { $ref: '#/components/responses/MyFleetPapLogListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/pap/corporation:
    get:
      operationId: getCorporationPapSummary
      x-gin-ignore-invalid-query: ["year"]
      x-gin-access: ["jwt", "login", "cap:menu.operation"]
      parameters:
        - name: current
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 200 }
          description: Page size capped at 1000.
        - name: period
          in: query
          schema: { type: string, default: last_month }
          description: Supported periods are current_month, last_month, at_year, and all; last_year is accepted as an alias.
        - name: year
          in: query
          schema: { type: integer }
          description: Missing or malformed values are handled as unspecified.
        - name: corp_tickers
          in: query
          schema: { type: string }
          description: Comma-separated corporate tickers.
      responses:
        '200': { $ref: '#/components/responses/FleetCorporationPapPageResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/pap/alliance:
    get:
      operationId: getMyAlliancePAP
      x-gin-ignore-invalid-query: ["year", "month"]
      x-gin-access: ["jwt", "login", "cap:menu.operation"]
      parameters:
        - name: year
          in: query
          schema: { type: integer }
          description: Defaults to the current year when missing or malformed.
        - name: month
          in: query
          schema: { type: integer }
          description: Defaults to the current month when missing or malformed.
      responses:
        '200': { $ref: '#/components/responses/FleetAlliancePAPDataResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}/invites:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getInvites
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetInviteListResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createInvite
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetInviteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/invites/{invite_id}:
    parameters:
      - name: invite_id
        in: path
        required: true
        schema: { type: integer, x-go-type: uint, minimum: 1, maximum: 4294967295 }
    delete:
      operationId: deactivateInvite
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetNullResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/join:
    post:
      operationId: joinFleet
      x-gin-access: ["jwt", "login", "cap:menu.operation"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetJoinInput' }
      responses:
        '200': { $ref: '#/components/responses/FleetNullResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/esi/{character_id}:
    parameters:
      - name: character_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getCharacterFleetInfo
      x-gin-access: ["jwt", "login", "cap:menu.operation"]
      responses:
        '200': { $ref: '#/components/responses/FleetCharacterInfoResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}/ping:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: pingFleet
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      responses:
        '200': { $ref: '#/components/responses/FleetNullResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operation/fleets/{id}/qq-ping:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: sendFleetQQPing
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetQQPingInput' }
      responses:
        '202':
          description: Durable tasks accepted, or the result of replaying the same idempotency key. Acceptance does not indicate delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetQQPingAccepted' }
        '400': { $ref: '#/components/responses/QQOfficialBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QQOfficialNotFound' }
        '409': { $ref: '#/components/responses/QQOfficialConflict' }
        '429': { $ref: '#/components/responses/QQOfficialRateLimited' }
        '503': { $ref: '#/components/responses/QQOfficialUnavailable' }
    get:
      operationId: listFleetQQPingResults
      x-gin-access: ["jwt", "login", "cap:menu.operation", "role:admin,fc,senior_fc"]
      parameters:
        - name: current
          in: query
          schema: { type: integer, default: 1, minimum: 1, maximum: 10000 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Redacted fleet notification tasks, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetQQPingPageSuccess' }
        '400': { $ref: '#/components/responses/QQOfficialBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QQOfficialNotFound' }
        '503': { $ref: '#/components/responses/QQOfficialUnavailable' }
components:
  responses:
    FleetPageResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetPageSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetRecordResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetRecordSuccess'
              - $ref: '#/components/schemas/BusinessError'
    MyFleetListResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MyFleetListSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetNullResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/NullSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetMemberListResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetMemberListSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetMemberWithPapPageResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetMemberWithPapPageSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetManualAddResultDataResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetManualAddResultDataSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetESIMemberListResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetESIMemberListSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetPapLogListResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetPapLogListSuccess'
              - $ref: '#/components/schemas/BusinessError'
    MyFleetPapLogListResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MyFleetPapLogListSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetCorporationPapPageResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetCorporationPapPageSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetAlliancePAPDataResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetAlliancePAPDataSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetInviteListResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetInviteListSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetInviteResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetInviteSuccess'
              - $ref: '#/components/schemas/BusinessError'
    FleetCharacterInfoResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FleetCharacterInfoSuccess'
              - $ref: '#/components/schemas/BusinessError'
  schemas:
    FleetPageSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetPage' }
    FleetRecordSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetRecord' }
    MyFleetListSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { type: array, nullable: true, items: { $ref: '#/components/schemas/FleetRecord' } }
    FleetMemberListSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { type: array, nullable: true, items: { $ref: '#/components/schemas/FleetMember' } }
    FleetMemberWithPapPageSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetMemberWithPapPage' }
    FleetManualAddResultDataSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetManualAddResultData' }
    FleetESIMemberListSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { type: array, nullable: true, items: { $ref: '#/components/schemas/FleetESIMember' } }
    FleetPapLogListSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { type: array, nullable: true, items: { $ref: '#/components/schemas/FleetPapLog' } }
    MyFleetPapLogListSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { type: array, nullable: true, items: { $ref: '#/components/schemas/FleetPapLogDetail' } }
    FleetCorporationPapPageSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetCorporationPapPage' }
    FleetAlliancePAPDataSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetAlliancePAPData' }
    FleetInviteListSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { type: array, nullable: true, items: { $ref: '#/components/schemas/FleetInvite' } }
    FleetInviteSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetInvite' }
    FleetCharacterInfoSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetCharacterInfo' }
    FleetCreateInput:
      type: object
      required: [title, start_at, end_at, importance, pap_count, character_id]
      properties:
        # Preserve Gin's validation error order from the original input struct.
        title: { type: string, x-order: 1, x-oapi-codegen-extra-tags: { binding: 'required' } }
        description: { type: string, x-order: 2, x-go-type-skip-optional-pointer: true }
        start_at: { type: string, format: date-time, x-go-type: string, x-order: 3, x-oapi-codegen-extra-tags: { binding: 'required' } }
        end_at: { type: string, format: date-time, x-go-type: string, x-order: 4, x-oapi-codegen-extra-tags: { binding: 'required' } }
        importance: { type: string, enum: [strat_op, cta, other], x-go-type: string, x-order: 5, x-oapi-codegen-extra-tags: { binding: 'required,oneof=strat_op cta other' } }
        pap_count: { type: number, format: double, minimum: 0, exclusiveMinimum: true, multipleOf: 0.5, x-order: 6 }
        character_id: { type: integer, format: int64, x-go-name: CharacterID, x-order: 7, x-oapi-codegen-extra-tags: { binding: 'required' } }
        send_ping: { type: boolean, x-order: 8, x-go-type-skip-optional-pointer: true }
        fleet_config_id: { type: integer, minimum: 0, x-go-type: uint, x-go-name: FleetConfigID, x-order: 9, nullable: true }
        auto_srp_mode: { type: string, x-go-name: AutoSrpMode, x-order: 10, x-go-type-skip-optional-pointer: true }
        send_qq_ping: { type: boolean, default: false, x-go-name: SendQQPing, x-order: 11, x-go-type-skip-optional-pointer: true }
    FleetQQPingInput:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string, format: uuid, x-go-type: string, x-oapi-codegen-extra-tags: { binding: 'required,uuid' } }
    FleetQQPingAccepted:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetQQPingReceipt' }
    FleetQQPingReceipt:
      type: object
      required: [tasks]
      properties:
        tasks: { type: array, items: { $ref: '#/components/schemas/QQOfficialTaskReceipt' } }
    FleetQQPingPageSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/FleetQQPingPage' }
