paths:
  /tasks:
    get:
      operationId: getManagedTasks
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin"]
      responses:
        '200':
          description: Registered task definitions or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ManagedTasksSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/history:
    get:
      operationId: listManagedTaskHistory
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin"]
      parameters:
        - { name: current, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20 }, description: Page size capped at 1000. }
        - { name: task_name, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: Task execution page or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ManagedTaskHistorySuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{name}/run:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      operationId: runManagedTask
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin", "cap:system.task.run"]
      responses:
        '200':
          description: Task accepted for execution or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskCommandSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The task is already running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedTaskRunConflict' }
  /tasks/{name}/schedule:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateManagedTaskSchedule
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin", "role:super_admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedTaskScheduleInput' }
      responses:
        '200':
          description: Schedule updated or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskCommandSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/esi/tasks:
    get:
      operationId: listEsiRefreshTasks
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin"]
      responses:
        '200':
          description: Registered ESI refresh tasks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsiRefreshTasksSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/esi/statuses:
    get:
      operationId: listEsiRefreshStatuses
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin"]
      parameters:
        - { name: current, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20 }, description: Page size capped at 1000. }
        - { name: task_name, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: character, in: query, schema: { type: string }, description: Character ID or case-insensitive character name fragment. }
      responses:
        '200':
          description: ESI refresh status page or business error. A valid page beyond the filtered results returns an empty list with the requested page number. When the refresh queue is not initialized, the default empty page is returned even if pagination cannot be parsed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EsiRefreshStatusesSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/esi/monitor:
    get:
      operationId: getEsiRefreshMonitor
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin"]
      responses:
        '200':
          description: Aggregate ESI refresh queue snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsiRefreshMonitorSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/esi/run:
    post:
      operationId: runEsiRefreshTask
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin", "cap:system.task.run"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EsiRefreshRunInput' }
      responses:
        '200':
          description: Refresh triggered for one character or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskCommandSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/esi/run-task:
    post:
      operationId: runEsiRefreshTaskByName
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin", "cap:system.task.run"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EsiRefreshRunByNameInput' }
      responses:
        '200':
          description: Refresh accepted for all eligible characters or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskCommandSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/esi/run-all:
    post:
      operationId: runEsiRefreshAll
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin", "cap:system.task.run"]
      responses:
        '200':
          description: Full refresh accepted or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskCommandSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/esi/tasks/{name}/interval:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateEsiRefreshTaskInterval
      x-gin-access: ["jwt", "login", "cap:system.task.read", "role:admin", "role:super_admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EsiRefreshIntervalInput' }
      responses:
        '200':
          description: ESI refresh intervals updated or business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskCommandSuccess'
                  - $ref: '#/components/schemas/BusinessError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  schemas:
    ManagedTaskCategory:
      type: string
      enum: [esi, operation, system]
    ManagedTaskType:
      type: string
      enum: [recurring, triggered]
    ManagedTaskRunStatus:
      type: string
      enum: [running, success, failed]
    ManagedTaskTrigger:
      type: string
      enum: [cron, manual]
    ManagedTaskLastExecution:
      type: object
      nullable: true
      required: [status, started_at]
      properties:
        status: { $ref: '#/components/schemas/ManagedTaskRunStatus' }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        error: { type: string, x-go-type-skip-optional-pointer: true }
        summary: { type: string, x-go-type-skip-optional-pointer: true }
    ManagedTaskDefinition:
      type: object
      required: [name, description, category, type, runnable, cron_expr, default_cron, last_execution]
      properties:
        name: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/ManagedTaskCategory' }
        type: { $ref: '#/components/schemas/ManagedTaskType' }
        runnable: { type: boolean }
        cron_expr: { type: string }
        default_cron: { type: string }
        last_execution: { $ref: '#/components/schemas/ManagedTaskLastExecution' }
    ManagedTaskExecution:
      type: object
      required: [id, task_name, trigger, status, started_at]
      properties:
        id: { type: integer, x-go-type: uint }
        task_name: { type: string }
        trigger: { $ref: '#/components/schemas/ManagedTaskTrigger' }
        triggered_by: { type: integer, x-go-type: uint }
        triggered_by_name: { type: string, x-go-type-skip-optional-pointer: true }
        status: { $ref: '#/components/schemas/ManagedTaskRunStatus' }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        error: { type: string, x-go-type-skip-optional-pointer: true }
        summary: { type: string, x-go-type-skip-optional-pointer: true }
    ManagedTaskHistoryPage:
      type: object
      required: [list, total, page, pageSize]
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/ManagedTaskExecution' } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer, x-go-name: PageSize }
    ManagedTaskScheduleInput:
      type: object
      required: [cron_expr]
      properties:
        cron_expr: { type: string, minLength: 1, x-oapi-codegen-extra-tags: { binding: required } }
    ManagedTaskRunConflict:
      type: object
      required: [code, msg]
      properties:
        code: { type: integer, enum: [409] }
        msg: { type: string }
    TaskCommandMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    EsiRefreshTask:
      type: object
      required: [name, description, priority, active_interval, inactive_interval, active_interval_minutes, inactive_interval_minutes, required_scopes]
      properties:
        name: { type: string }
        description: { type: string }
        priority: { type: integer }
        active_interval: { type: string }
        inactive_interval: { type: string }
        active_interval_minutes: { type: integer }
        inactive_interval_minutes: { type: integer }
        required_scopes: { type: array, items: { type: string } }
    EsiRefreshState:
      type: string
      enum: [pending, running, success, failed, skipped]
    EsiRefreshStatus:
      type: object
      required: [task_name, description, character_id, priority, status]
      properties:
        task_name: { type: string }
        description: { type: string }
        character_id: { type: integer, format: int64, x-go-name: CharacterID }
        character_name: { type: string, x-go-type-skip-optional-pointer: true }
        priority: { type: integer }
        last_run: { type: string, format: date-time }
        next_run: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/EsiRefreshState' }
        error: { type: string, x-go-type-skip-optional-pointer: true }
    EsiRefreshStatusPage:
      type: object
      required: [list, total, page, pageSize]
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/EsiRefreshStatus' } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer, x-go-name: PageSize }
    EsiRefreshMonitorOverview:
      type: object
      required: [total, healthy, warning, critical, running, failed, overdue]
      properties:
        total: { type: integer }
        healthy: { type: integer }
        warning: { type: integer }
        critical: { type: integer }
        running: { type: integer }
        failed: { type: integer }
        overdue: { type: integer }
    EsiRefreshMonitorTaskPanel:
      allOf:
        - $ref: '#/components/schemas/EsiRefreshMonitorOverview'
        - type: object
          required: [task_name, description, priority, success_rate, worst_lag_seconds]
          properties:
            task_name: { type: string }
            description: { type: string }
            priority: { type: integer }
            success_rate: { type: number, format: double }
            worst_lag_seconds: { type: integer, format: int64 }
    EsiRefreshMonitorFailure:
      type: object
      required: [task_name, description, character_id, error]
      properties:
        task_name: { type: string }
        description: { type: string }
        character_id: { type: integer, format: int64, x-go-name: CharacterID }
        character_name: { type: string, x-go-type-skip-optional-pointer: true }
        error: { type: string }
        last_run: { type: string, format: date-time }
    EsiRefreshMonitorOverdue:
      type: object
      required: [task_name, description, character_id, overdue_seconds]
      properties:
        task_name: { type: string }
        description: { type: string }
        character_id: { type: integer, format: int64, x-go-name: CharacterID }
        character_name: { type: string, x-go-type-skip-optional-pointer: true }
        next_run: { type: string, format: date-time }
        overdue_seconds: { type: integer, format: int64 }
    EsiRefreshMonitorSnapshot:
      type: object
      required: [generated_at, overview, task_panels, failure_top, overdue_top]
      properties:
        generated_at: { type: string, format: date-time }
        overview: { $ref: '#/components/schemas/EsiRefreshMonitorOverview' }
        task_panels: { type: array, items: { $ref: '#/components/schemas/EsiRefreshMonitorTaskPanel' } }
        failure_top: { type: array, items: { $ref: '#/components/schemas/EsiRefreshMonitorFailure' } }
        overdue_top: { type: array, items: { $ref: '#/components/schemas/EsiRefreshMonitorOverdue' } }
    EsiRefreshRunInput:
      type: object
      required: [task_name, character_id]
      properties:
        task_name: { type: string, minLength: 1, x-oapi-codegen-extra-tags: { binding: required } }
        character_id: { type: integer, format: int64, x-go-name: CharacterID, x-oapi-codegen-extra-tags: { binding: required } }
    EsiRefreshRunByNameInput:
      type: object
      required: [task_name]
      properties:
        task_name: { type: string, minLength: 1, x-oapi-codegen-extra-tags: { binding: required } }
    EsiRefreshIntervalInput:
      type: object
      required: [active_minutes, inactive_minutes]
      properties:
        active_minutes: { type: integer, minimum: 1, x-oapi-codegen-extra-tags: { binding: required } }
        inactive_minutes: { type: integer, minimum: 1, x-oapi-codegen-extra-tags: { binding: required } }
    ManagedTasksSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/ManagedTaskDefinition' } }
    ManagedTaskHistorySuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/ManagedTaskHistoryPage' }
    TaskCommandSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/TaskCommandMessage' }
    EsiRefreshTasksSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/EsiRefreshTask' } }
    EsiRefreshStatusesSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/EsiRefreshStatusPage' }
    EsiRefreshMonitorSuccess:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [200] }
        msg: { type: string }
        data: { $ref: '#/components/schemas/EsiRefreshMonitorSnapshot' }
