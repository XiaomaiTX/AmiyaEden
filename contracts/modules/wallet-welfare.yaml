paths:
  /system/wallet/list:
    post:
      operationId: adminListSystemWallets
      x-gin-body: { allowMalformedJSON: true }
      x-gin-access: ["jwt", "login", "role:admin", "cap:system.wallet.read"]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SystemWalletListInput'}
      responses:
        '200': {$ref: '#/components/responses/SystemWalletListPageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/wallet/detail:
    post:
      operationId: adminGetSystemWallet
      x-gin-access: ["jwt", "login", "role:admin", "cap:system.wallet.read"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SystemWalletDetailInput'}
      responses:
        '200': {$ref: '#/components/responses/ShopWalletResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/wallet/adjust:
    post:
      operationId: adminAdjustSystemWallet
      x-gin-access: ["jwt", "login", "role:admin", "cap:system.wallet.read", "cap:system.wallet.adjust"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SystemWalletAdjustInput'}
      responses:
        '200': {$ref: '#/components/responses/ShopWalletResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/wallet/transactions:
    post:
      operationId: adminListSystemWalletTransactions
      x-gin-body: { allowMalformedJSON: true }
      x-gin-access: ["jwt", "login", "role:admin", "cap:system.wallet.read"]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SystemWalletTransactionListInput'}
      responses:
        '200': {$ref: '#/components/responses/ShopWalletTransactionPageResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/wallet/logs:
    post:
      operationId: adminListSystemWalletLogs
      x-gin-body: { allowMalformedJSON: true }
      x-gin-access: ["jwt", "login", "role:admin", "cap:system.wallet.read"]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SystemWalletLogListInput'}
      responses:
        '200': {$ref: '#/components/responses/SystemWalletLogPageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/wallet/analytics:
    post:
      operationId: adminGetSystemWalletAnalytics
      x-gin-access: ["jwt", "login", "role:admin", "cap:system.wallet.read"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SystemWalletAnalyticsInput'}
      responses:
        '200': {$ref: '#/components/responses/SystemWalletAnalyticsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/list:
    post:
      operationId: adminListWelfares
      x-gin-body: { allowMalformedJSON: true }
      x-gin-access: ["jwt", "login", "cap:welfare.user", "role:admin,welfare"]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareListInput'}
      responses:
        '200': {$ref: '#/components/responses/WelfarePageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/add:
    post:
      operationId: adminCreateWelfare
      x-gin-access: ["jwt", "login", "role:admin", "cap:welfare.settings"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareCreateInput'}
      responses:
        '200': {$ref: '#/components/responses/WelfareItemResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/edit:
    post:
      operationId: adminUpdateWelfare
      x-gin-access: ["jwt", "login", "role:admin", "cap:welfare.settings"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareUpdateInput'}
      responses:
        '200': {$ref: '#/components/responses/WelfareItemResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/delete:
    post:
      operationId: adminDeleteWelfare
      x-gin-access: ["jwt", "login", "role:admin", "cap:welfare.settings"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareIDInput'}
      responses:
        '200': {$ref: '#/components/responses/WalletWelfareNullResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/reorder:
    post:
      operationId: adminReorderWelfares
      x-gin-access: ["jwt", "login", "role:admin", "cap:welfare.settings"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareReorderInput'}
      responses:
        '200': {$ref: '#/components/responses/WalletWelfareNullResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/settings:
    get:
      operationId: adminGetWelfareSettings
      x-gin-access: ["jwt", "login", "role:admin"]
      responses:
        '200': {$ref: '#/components/responses/WelfareSettingsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: adminUpdateWelfareSettings
      x-gin-access: ["jwt", "login", "role:admin", "cap:welfare.settings"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareSettingsInput'}
      responses:
        '200': {$ref: '#/components/responses/WelfareSettingsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/import:
    post:
      operationId: adminImportWelfareRecords
      x-gin-access: ["jwt", "login", "role:admin", "cap:welfare.settings"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareImportInput'}
      responses:
        '200': {$ref: '#/components/responses/WelfareImportResultResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/applications:
    post:
      operationId: adminListWelfareApplications
      x-gin-body: { allowMalformedJSON: true }
      x-gin-access: ["jwt", "login", "cap:welfare.approval", "role:admin,welfare"]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareAdminApplicationListInput'}
      responses:
        '200': {$ref: '#/components/responses/WelfareAdminApplicationPageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/applications/delete:
    post:
      operationId: adminDeleteWelfareApplication
      x-gin-access: ["jwt", "login", "role:admin", "cap:welfare.approval"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareIDInput'}
      responses:
        '200': {$ref: '#/components/responses/WalletWelfareNullResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /system/welfare/review:
    post:
      operationId: adminReviewWelfareApplication
      x-gin-access: ["jwt", "login", "cap:welfare.approval", "role:admin,welfare"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareReviewInput'}
      responses:
        '200': {$ref: '#/components/responses/WelfareReviewResultResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /welfare/eligible:
    post:
      operationId: getEligibleWelfares
      x-gin-access: ["jwt", "login", "cap:welfare.user"]
      responses:
        '200': {$ref: '#/components/responses/WelfareEligibleListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /welfare/apply:
    post:
      operationId: applyForWelfare
      x-gin-access: ["jwt", "login", "cap:welfare.user"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareApplyInput'}
      responses:
        '200': {$ref: '#/components/responses/WelfareApplicationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /welfare/my-applications:
    post:
      operationId: listMyWelfareApplications
      x-gin-body: { allowMalformedJSON: true }
      x-gin-access: ["jwt", "login", "cap:welfare.user"]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WelfareMyApplicationListInput'}
      responses:
        '200': {$ref: '#/components/responses/WelfareMyApplicationPageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  responses:
    SystemWalletListPageResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/SystemWalletListPageSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    SystemWalletLogPageResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/SystemWalletLogPageSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    SystemWalletAnalyticsResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/SystemWalletAnalyticsSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WelfarePageResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/WelfarePageSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WelfareItemResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/WelfareItemSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WalletWelfareNullResult:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/NullSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WelfareSettingsResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/WelfareSettingsSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WelfareImportResultResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/WelfareImportResultSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WelfareAdminApplicationPageResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/WelfareAdminApplicationPageSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WelfareReviewResultResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/WelfareReviewResultSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WelfareEligibleListResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/WelfareEligibleListSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WelfareApplicationResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/WelfareApplicationSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
    WelfareMyApplicationPageResponse:
      description: Success or business error.
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/WelfareMyApplicationPageSuccess'}
            - {$ref: '#/components/schemas/BusinessError'}
  schemas:
    SystemWalletListPageSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/SystemWalletListPage'}
      required: [code, msg, data]
    SystemWalletLogPageSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/SystemWalletLogPage'}
      required: [code, msg, data]
    SystemWalletAnalyticsSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/SystemWalletAnalytics'}
      required: [code, msg, data]
    WelfarePageSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/WelfarePage'}
      required: [code, msg, data]
    WelfareItemSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/WelfareItem'}
      required: [code, msg, data]
    WelfareSettingsSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/WelfareSettings'}
      required: [code, msg, data]
    WelfareImportResultSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/WelfareImportResult'}
      required: [code, msg, data]
    WelfareAdminApplicationPageSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/WelfareAdminApplicationPage'}
      required: [code, msg, data]
    WelfareReviewResultSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/WelfareReviewResult'}
      required: [code, msg, data]
    WelfareEligibleListSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/WelfareEligibleList'}
      required: [code, msg, data]
    WelfareApplicationSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/WelfareApplication'}
      required: [code, msg, data]
    WelfareMyApplicationPageSuccess:
      type: object
      properties:
        code: {type: integer, enum: [200]}
        msg: {type: string}
        data: {$ref: '#/components/schemas/WelfareMyApplicationPage'}
      required: [code, msg, data]
    SystemWalletListInput:
      type: object
      properties:
        current: {type: integer, default: 1, x-go-type-skip-optional-pointer: true}
        size: {type: integer, default: 200, description: Values below 1 use 200 and values above 1000 use 1000. A missing or malformed body uses
            20., x-go-type-skip-optional-pointer: true}
        user_keyword: {type: string, x-go-type-skip-optional-pointer: true}
        sort_by: {type: string, x-go-type-skip-optional-pointer: true}
        sort_order: {type: string, x-go-type-skip-optional-pointer: true}
    SystemWalletDetailInput:
      type: object
      properties:
        user_id: {type: integer, x-go-type: uint, x-go-name: UserID, x-oapi-codegen-extra-tags: {binding: required}, minimum: 1}
      required: [user_id]
    SystemWalletAdjustInput:
      type: object
      properties:
        target_uid: {type: integer, x-go-type: uint, x-go-name: TargetUID, x-oapi-codegen-extra-tags: {binding: required}, minimum: 1}
        action: {type: string, x-oapi-codegen-extra-tags: {binding: 'required,oneof=add deduct set'}, enum: [add, deduct, set], x-go-type: string}
        amount: {type: number, format: double, x-oapi-codegen-extra-tags: {binding: 'required,gt=0'}, minimum: 0, exclusiveMinimum: true}
        reason: {type: string, x-oapi-codegen-extra-tags: {binding: required}, minLength: 1}
      required: [target_uid, action, amount, reason]
    SystemWalletTransactionListInput:
      type: object
      properties:
        current: {type: integer, default: 1, x-go-type-skip-optional-pointer: true}
        size: {type: integer, default: 200, description: Values below 1 use 200 and values above 1000 use 1000. A missing or malformed body uses
            20., x-go-type-skip-optional-pointer: true}
        user_id: {type: integer, x-go-type: uint, nullable: true, x-go-name: UserID}
        user_keyword: {type: string, x-go-type-skip-optional-pointer: true}
        ref_type: {type: string, x-go-type-skip-optional-pointer: true}
        sort_by: {type: string, x-go-type-skip-optional-pointer: true}
        sort_order: {type: string, x-go-type-skip-optional-pointer: true}
    SystemWalletLogListInput:
      type: object
      properties:
        current: {type: integer, default: 1, x-go-type-skip-optional-pointer: true}
        size: {type: integer, default: 200, description: Values below 1 use 200 and values above 1000 use 1000. A missing or malformed body uses
            20., x-go-type-skip-optional-pointer: true}
        operator_id: {type: integer, x-go-type: uint, nullable: true, x-go-name: OperatorID}
        target_uid: {type: integer, x-go-type: uint, nullable: true, x-go-name: TargetUID}
        action: {type: string, x-go-type-skip-optional-pointer: true}
        sort_by: {type: string, x-go-type-skip-optional-pointer: true}
        sort_order: {type: string, x-go-type-skip-optional-pointer: true}
    SystemWalletAnalyticsInput:
      type: object
      properties:
        start_date: {type: string, description: Use YYYY-MM-DD and supply both dates or neither., x-go-type-skip-optional-pointer: true}
        end_date: {type: string, description: Use YYYY-MM-DD and supply both dates or neither., x-go-type-skip-optional-pointer: true}
        ref_types: {type: array, items: {type: string}, x-go-type-skip-optional-pointer: true}
        user_keyword: {type: string, x-go-type-skip-optional-pointer: true}
        top_n: {type: integer, description: Use 1–50. Omitted and zero select 10., default: 10, x-go-type-skip-optional-pointer: true}
    WelfareListInput:
      type: object
      properties:
        current: {type: integer, default: 1, x-go-type-skip-optional-pointer: true}
        size: {type: integer, default: 20, description: Values outside 1–100 use 20., x-go-type-skip-optional-pointer: true}
        status: {type: integer, minimum: -128, maximum: 127, x-go-type: int8, nullable: true}
        name: {type: string, x-go-type-skip-optional-pointer: true}
    WelfareCreateInput:
      type: object
      properties:
        name: {type: string, x-oapi-codegen-extra-tags: {binding: required}, minLength: 1}
        description: {type: string, x-go-type-skip-optional-pointer: true}
        dist_mode: {type: string, x-oapi-codegen-extra-tags: {binding: 'required,oneof=per_user per_character'}, enum: [per_user, per_character],
          x-go-type: string}
        pay_by_fuxi_coin: {type: integer, nullable: true}
        require_skill_plan: {type: boolean, x-go-type-skip-optional-pointer: true}
        skill_plan_ids: {type: array, items: {type: integer, x-go-type: uint}, x-go-name: SkillPlanIDs, x-go-type-skip-optional-pointer: true}
        max_char_age_months: {type: integer, nullable: true}
        minimum_pap: {type: integer, nullable: true}
        minimum_fuxi_legion_years: {type: integer, nullable: true}
        require_evidence: {type: boolean, x-go-type-skip-optional-pointer: true}
        example_evidence: {type: string, x-go-type-skip-optional-pointer: true}
        status: {type: integer, minimum: -128, maximum: 127, x-go-type: int8, x-go-type-skip-optional-pointer: true}
        sort_order: {type: integer, x-go-type-skip-optional-pointer: true}
      required: [name, dist_mode]
    WelfareIDInput:
      type: object
      properties:
        id: {type: integer, x-go-type: uint, x-go-name: ID, x-oapi-codegen-extra-tags: {binding: required}, minimum: 1}
      required: [id]
    WelfareReorderInput:
      type: object
      properties:
        ids: {type: array, items: {type: integer, x-go-type: uint}, x-go-name: IDs, x-oapi-codegen-extra-tags: {binding: required}}
      required: [ids]
    WelfareSettingsInput:
      type: object
      properties:
        auto_approve_fuxi_coin_threshold: {type: integer, minimum: 0, x-go-type: '*int', x-oapi-codegen-extra-tags: {binding: 'required,gte=0'}}
      required: [auto_approve_fuxi_coin_threshold]
    WelfareImportInput:
      type: object
      properties:
        welfare_id: {type: integer, x-go-type: uint, x-go-name: WelfareID, x-oapi-codegen-extra-tags: {binding: required}, minimum: 1}
        csv: {type: string, x-go-name: CSV, x-oapi-codegen-extra-tags: {binding: required}, minLength: 1}
      required: [welfare_id, csv]
    WelfareAdminApplicationListInput:
      type: object
      properties:
        current: {type: integer, default: 1, x-go-type-skip-optional-pointer: true}
        size: {type: integer, default: 200, description: Values below 1 use 200 and values above 1000 use 1000. A missing or malformed body uses
            50., x-go-type-skip-optional-pointer: true}
        status: {type: string, x-go-type-skip-optional-pointer: true}
        keyword: {type: string, x-go-type-skip-optional-pointer: true}
    WelfareReviewInput:
      type: object
      properties:
        id: {type: integer, x-go-type: uint, x-go-name: ID, x-oapi-codegen-extra-tags: {binding: required}, minimum: 1}
        action: {type: string, x-oapi-codegen-extra-tags: {binding: 'required,oneof=deliver reject'}, enum: [deliver, reject], x-go-type: string}
      required: [id, action]
    WelfareApplyInput:
      type: object
      properties:
        welfare_id: {type: integer, x-go-type: uint, x-go-name: WelfareID, x-oapi-codegen-extra-tags: {binding: required}, minimum: 1}
        character_id: {type: integer, format: int64, x-go-name: CharacterID, x-go-type-skip-optional-pointer: true}
        evidence_image: {type: string, x-go-type-skip-optional-pointer: true}
      required: [welfare_id]
    WelfareMyApplicationListInput:
      type: object
      properties:
        current: {type: integer, default: 1, x-go-type-skip-optional-pointer: true}
        size: {type: integer, default: 10, description: Values outside 1–100 use 10., x-go-type-skip-optional-pointer: true}
        status: {type: string, x-go-type-skip-optional-pointer: true}
    WelfareUpdateInput:
      type: object
      properties:
        id: {type: integer, x-go-type: uint, x-go-name: ID, x-oapi-codegen-extra-tags: {binding: required}, minimum: 1}
        name: {type: string}
        description: {type: string, x-go-type-skip-optional-pointer: true}
        dist_mode: {type: string, enum: [per_user, per_character], x-go-type: string}
