server:
  port: "8080"
  mode: "debug" # debug | release | test
  cors_origins: [] # 允许的 CORS 源。空=仅 debug 模式允许 *。生产环境应填写前端域名，如 ["https://eden.example.com"]

database:
  host: "amiya-eden-postgres"
  port: 5432
  user: "postgres"
  password: "amiya_eden_password"
  dbname: "amiya_eden"
  sslmode: "disable"
  max_idle_conns: 10
  max_open_conns: 100

log:
  level: "debug"          # debug | info | warn | error
  filename: "logs/app.log"
  max_size: 100           # 单文件最大 100MB
  max_backups: 7          # 最多保留 7 个备份
  max_age: 30             # 最多保留 30 天
  compress: true          # 压缩旧文件

jwt:
  secret: "change_me_in_production"
  expire_day: 7

redis:
  addr: "amiya-eden-redis:6379"
  password: "amiya_eden_redis_password"  # 无密码留空
  db: 0                 # 使用默认 DB
  pool_size: 10         # 连接池大小

eve_sso:
  client_id: ""          # EVE 开发者控制台申请的 Client ID
  client_secret: ""  # EVE 开发者控制台申请的 Client Secret
  callback_url: "http://localhost:8080/api/v1/sso/eve/callback"
  esi_base_url: "https://esi.evetech.net" # ESI 根地址
  esi_api_prefix: "/latest"               # ESI API 前缀
  sso_authorize_url: "https://login.eveonline.com/v2/oauth/authorize" # EVE SSO 授权地址
  sso_token_url: "https://login.eveonline.com/v2/oauth/token"          # EVE SSO Token 地址

app:
  super_admins: []  # 超级管理员角色 ID 列表，仅通过配置文件管理，例如 [123456789, 987654321]

