upstream amiya_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/xml text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    client_max_body_size 10M;

    # Always revalidate SPA entry HTML so deployments pick up new hashed assets immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashed build assets are immutable.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache remaining static assets.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Keep API requests same-origin and forward them to the Compose backend service.
    location /api/ {
        proxy_pass http://amiya_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback remains useful for direct asset-free entry requests; app routing uses hashes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
